[package]
name = "codespacectl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Manifest-driven CLI for agent-driven GitHub Codespace operations"
license = "MIT"
repository = "https://github.com/topic-hash/codespacectl"
homepage = "https://github.com/topic-hash/codespacectl"
documentation = "https://github.com/topic-hash/codespacectl/blob/main/docs/CLI_REFERENCE.md"
keywords = ["github", "codespaces", "cli", "ssh", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "codespacectl"
path = "src/main.rs"

[lib]
name = "codespacectl"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# SSH (russh — pure Rust SSH client, no system ssh required)
russh = "0.46"
russh-keys = "0.46"
async-trait = "0.1"

# HTTP client (GitHub API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Secret encryption at rest
age = { version = "0.11", features = ["armor"] }

# Filesystem / paths
dirs = "5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
mockito = "1"
rstest = "0.22"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
